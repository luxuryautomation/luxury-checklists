<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>Wi-Fi, Conforto e Segurança — Checklist de Obra · Luxury Automation</title>
<meta property="og:title" content="Checklist de Obra · Piracicaba 541">
<meta property="og:description" content="Luxury Automation · Conferência de instalação por ambiente">
<style>
/* ======= Luxury Automation · Checklist de Obra ======= */
:root{--bg:#0e0e10;--card:#18181b;--card2:#1f1f23;--line:#2a2a2f;--txt:#ececef;--mut:#8b8b93;--acc:#c9a45c;--ok:#25d366;--okd:#1aa34f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 120px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.kicker{font-size:10.5px;letter-spacing:.18em;color:var(--mut);text-transform:uppercase}
.brand{font-size:10.5px;letter-spacing:.18em;color:var(--acc);text-transform:uppercase;margin-bottom:6px}
h1{font-size:21px;line-height:1.25;margin:4px 0 14px;font-weight:700}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .3s}
.prog{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin:7px 0 18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
label.f{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px}
input[type=text],input[type=date],textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
input[type=date]{color-scheme:dark}
textarea{min-height:96px;resize:vertical}
.grp{font-size:11.5px;letter-spacing:.16em;font-weight:700;margin:26px 0 10px;color:var(--txt)}
.room{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.room.done{border-color:#1f5f3a}
.rh{display:flex;align-items:center;gap:10px;padding:14px 13px;cursor:pointer;user-select:none}
.rh .n{flex:1;font-weight:600;font-size:15px}
.cnt{font-size:11px;background:var(--card2);color:var(--mut);padding:3px 8px;border-radius:6px}
.room.done .cnt{background:#143d26;color:var(--ok)}
.chev{color:var(--mut);transition:transform .2s;font-size:14px}
.room.open .chev{transform:rotate(90deg)}
.rb{display:none;border-top:1px solid var(--line);padding:6px 10px 10px}
.room.open .rb{display:block}
.it{display:flex;align-items:flex-start;gap:12px;padding:11px 4px;cursor:pointer;border-bottom:1px dashed var(--line)}
.it:last-of-type{border-bottom:0}
.cb{flex:0 0 24px;height:24px;border-radius:7px;border:2px solid #55555d;display:flex;align-items:center;justify-content:center;transition:.15s}
.it.on .cb{background:var(--ok);border-color:var(--ok)}
.it.on .cb:after{content:"";width:6px;height:11px;border:solid #0b0b0b;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it .t{font-size:14.5px;line-height:1.35}
.it.on .t{color:var(--mut);text-decoration:line-through}
.q{color:var(--acc);font-weight:700;margin-right:4px}
.all{margin-top:8px;width:100%;background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px;font-size:13px;cursor:pointer}
.room.done .all{color:var(--mut)}
.clear{margin-top:16px;background:transparent;border:1px solid #4a2626;color:#e57373;border-radius:10px;padding:11px 14px;font-size:13px;cursor:pointer}
.foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(14,14,16,0),var(--bg) 30%);padding:18px 16px calc(14px + env(safe-area-inset-bottom))}
.foot .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.wa{flex:1;background:var(--ok);color:#06210f;border:0;border-radius:11px;padding:15px;font-size:15px;font-weight:700;cursor:pointer}
.wa:active{background:var(--okd)}
.cp{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:15px 16px;font-size:14px;font-weight:600;cursor:pointer}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#26262b;color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.s{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand mono">Luxury Automation</div>
  <div class="kicker mono">Instalação · Conferência por ambiente</div>
  <h1 id="title"></h1>
  <div class="bar"><i id="bar"></i></div>
  <div class="prog mono"><span id="pt">0 de 0 itens</span><span id="pp">0%</span></div>

  <label class="f" for="cli">Cliente / obra</label>
  <input type="text" id="cli" placeholder="Ex.: Residência Piracicaba 541">
  <label class="f" for="tec">Técnico responsável pela instalação</label>
  <input type="text" id="tec" placeholder="Nome do técnico">
  <label class="f" for="dt">Data</label>
  <input type="date" id="dt">

  <div id="rooms"></div>

  <label class="f" for="obs" style="margin-top:24px">Observações gerais / pendências de instalação</label>
  <textarea id="obs" placeholder="Ex.: câmera da garagem aguardando definição de local…"></textarea>

  <button class="clear" id="clr">Limpar checklist</button>
</div>

<div class="foot"><div class="in">
  <button class="wa" id="wa">Enviar relatório no WhatsApp</button>
  <button class="cp" id="cp">Copiar</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO DA OBRA — para uma obra nova, troque só este bloco.
   ===================================================================== */
const CONFIG = {
  id: "piracicaba541",                       // chave única (salvamento local)
  titulo: "Wi-Fi, Conforto e Segurança — Checklist de Obra",
  clientePadrao: "Residência Piracicaba 541 · Alphaville, Tamboré 1",
  grupos: [
    { nome: "TÉRREO", emoji: "🟦", ambientes: [
      { nome: "Área Gourmet", itens: [[1, "Access point Ubiquiti UniFi U7 Lite (Wi-Fi 7)"]] },
      { nome: "Escritório",   itens: [[1, "Access point Ubiquiti UniFi U7 Lite (Wi-Fi 7)"]] },
      { nome: "Garagem",      itens: [[1, "Sensor de presença mmWave de embutir no teto"]] },
      { nome: "Sala de Estar",itens: [[1, "Access point Ubiquiti UniFi U7 Lite (Wi-Fi 7)"]] },
      { nome: "Sala de TV",   itens: [[1, "Access point Ubiquiti UniFi U7 Lite (Wi-Fi 7)"]] },
    ]},
    { nome: "SUPERIOR", emoji: "🟪", ambientes: [
      { nome: "Banho 1", itens: [[1, "Termostato Slim Wi-Fi do piso aquecido"], [2, "Película desembaçadora de espelho 50x50"]] },
      { nome: "Banho 2", itens: [[1, "Película desembaçadora de espelho 50x50"]] },
      { nome: "Banho 3", itens: [[1, "Película desembaçadora de espelho 50x50"]] },
      { nome: "Banho Master", itens: [[1, "Termostato Slim Wi-Fi do piso aquecido"], [2, "Película desembaçadora de espelho 50x50"]] },
      { nome: "Closet Master", itens: [[1, "Termostato Slim Wi-Fi do piso aquecido"]] },
      { nome: "Suíte 1", itens: [[1, "Access point Ubiquiti UniFi U7 Lite (Wi-Fi 7)"]] },
      { nome: "Suíte 2", itens: [[1, "Access point Ubiquiti UniFi U7 Lite (Wi-Fi 7)"]] },
      { nome: "Suíte 3", itens: [[1, "Access point Ubiquiti UniFi U7 Lite (Wi-Fi 7)"]] },
      { nome: "Suíte Master", itens: [[1, "Access point Ubiquiti UniFi U7 Lite (Wi-Fi 7)"], [1, "Termostato Slim Wi-Fi do piso aquecido"], [2, "Caixa de embutir WSR120"]] },
    ]},
    { nome: "SEGURANÇA", emoji: "🟥", ambientes: [
      { nome: "Câmeras (locais a definir)", itens: [[4, "Câmera Ubiquiti UniFi G5 Flex (PoE)"]] },
    ]},
  ],
};
/* ===================================================================== */

const KEY = "la-checklist-" + CONFIG.id;
const $ = s => document.querySelector(s);
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
let st = {}; try { st = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {}
st.chk = st.chk || {}; st.open = st.open || {};
if (st.cli === undefined) st.cli = CONFIG.clientePadrao;
if (!st.dt) st.dt = today();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} };

const all = [];
CONFIG.grupos.forEach((g,gi) => g.ambientes.forEach((a,ai) => a.itens.forEach((it,ii) => all.push(`${gi}.${ai}.${ii}`))));

document.title = CONFIG.titulo; $("#title").textContent = CONFIG.titulo;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  let h = "";
  CONFIG.grupos.forEach((g,gi) => {
    h += `<div class="grp mono">${esc(g.nome)}</div>`;
    g.ambientes.forEach((a,ai) => {
      const rid = `${gi}.${ai}`, n = a.itens.length;
      const d = a.itens.filter((_,ii) => st.chk[`${rid}.${ii}`]).length;
      h += `<div class="room${st.open[rid]?" open":""}${d===n?" done":""}" data-r="${rid}">
        <div class="rh"><span class="n">${esc(a.nome)}</span><span class="cnt mono">${d}/${n}</span><span class="chev">›</span></div>
        <div class="rb">${a.itens.map((it,ii) => `<div class="it${st.chk[`${rid}.${ii}`]?" on":""}" data-i="${rid}.${ii}"><span class="cb"></span><span class="t"><span class="q">${it[0]}x</span>${esc(it[1])}</span></div>`).join("")}
        <button class="all" data-a="${rid}">${d===n?"Desmarcar ambiente":"Marcar ambiente como instalado"}</button></div></div>`;
    });
  });
  $("#rooms").innerHTML = h;
  const done = all.filter(k => st.chk[k]).length, p = all.length ? Math.round(done/all.length*100) : 0;
  $("#pt").textContent = `${done} de ${all.length} itens`; $("#pp").textContent = p + "%"; $("#bar").style.width = p + "%";
}

$("#rooms").addEventListener("click", e => {
  const it = e.target.closest(".it"), ab = e.target.closest(".all"), rh = e.target.closest(".rh");
  if (it) { const k = it.dataset.i; st.chk[k] = !st.chk[k]; }
  else if (ab) { const [gi,ai] = ab.dataset.a.split(".").map(Number); const its = CONFIG.grupos[gi].ambientes[ai].itens;
    const allOn = its.every((_,ii) => st.chk[`${gi}.${ai}.${ii}`]); its.forEach((_,ii) => st.chk[`${gi}.${ai}.${ii}`] = !allOn); }
  else if (rh) { const r = rh.parentNode.dataset.r; st.open[r] = !st.open[r]; }
  else return;
  save(); render();
});

[["cli","cli"],["tec","tec"],["dt","dt"],["obs","obs"]].forEach(([id,k]) => {
  const el = $("#"+id); el.value = st[k] || ""; el.addEventListener("input", () => { st[k] = el.value; save(); });
});

function report(){
  const done = all.filter(k => st.chk[k]).length, p = all.length ? Math.round(done/all.length*100) : 0;
  const dt = st.dt ? st.dt.split("-").reverse().join("/") : "";
  let t = `🏠 *LUXURY AUTOMATION*\n*${CONFIG.titulo}*\n\n`;
  t += `📍 *Obra:* ${st.cli || "—"}\n👷 *Técnico:* ${st.tec || "—"}\n📅 *Data:* ${dt || "—"}\n`;
  t += `📊 *Progresso:* ${done} de ${all.length} itens (${p}%)\n`;
  const pend = [];
  CONFIG.grupos.forEach((g,gi) => {
    t += `\n${g.emoji} *${g.nome}*\n`;
    g.ambientes.forEach((a,ai) => {
      const d = a.itens.filter((_,ii) => st.chk[`${gi}.${ai}.${ii}`]).length;
      t += `*${a.nome}* (${d}/${a.itens.length})\n`;
      a.itens.forEach((it,ii) => { const on = st.chk[`${gi}.${ai}.${ii}`];
        t += `${on?"✅":"⬜"} ${it[0]}x ${it[1]}\n`; if (!on) pend.push(`${a.nome}: ${it[0]}x ${it[1]}`); });
    });
  });
  t += pend.length ? `\n⏳ *Pendentes (${pend.length})*\n` + pend.map(x => "• " + x).join("\n") + "\n" : `\n🎉 *Todos os itens instalados!*\n`;
  t += `\n📝 *Observações / pendências:*\n${(st.obs||"").trim() || "_Nenhuma._"}\n\n_Legenda: ✅ instalado · ⬜ pendente_`;
  return t;
}
const toast = m => { const el = $("#toast"); el.textContent = m; el.classList.add("s"); setTimeout(() => el.classList.remove("s"), 1800); };

$("#wa").onclick = () => { const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(report()); const w = window.open(url, "_blank"); if (!w) { try { window.top.location.href = url; } catch(e) { window.location.href = url; } } };
$("#cp").onclick = async () => {
  const t = report();
  try { await navigator.clipboard.writeText(t); toast("Relatório copiado ✅"); }
  catch(e) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Relatório copiado ✅"); } catch(_) { toast("Não foi possível copiar"); } ta.remove(); }
};
$("#clr").onclick = () => {
  if (!confirm("Limpar todas as marcações, técnico e observações?")) return;
  st = { chk:{}, open:{}, cli: CONFIG.clientePadrao, dt: today(), tec:"", obs:"" }; save();
  ["cli","tec","dt","obs"].forEach(k => $("#"+k).value = st[k]); render(); toast("Checklist limpo");
};
render();
</script>
</body>
</html>
